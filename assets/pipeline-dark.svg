<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="Two-stage pipeline diagram">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#9198a1"/></marker></defs>
<rect x="1" y="1" width="1198" height="468" rx="16" fill="#0d1117" stroke="#30363d"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect x="30" y="40" width="190" height="110" rx="12" fill="#161b22" stroke="#3d444d" stroke-width="1.6"/>
<text x="125.0" y="60" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1.2" fill="#3d444d">INPUT</text>
<text x="125.0" y="86" text-anchor="middle" font-size="19" font-weight="650" fill="#e6edf3">Seismic shots x</text>
<text x="125.0" y="109" text-anchor="middle" font-size="15" fill="#9198a1">5 sources</text>
<text x="125.0" y="129" text-anchor="middle" font-size="15" fill="#9198a1">10001 × 31 each</text>
<rect x="285" y="40" width="270" height="110" rx="12" fill="#0c2d6b" stroke="#4493f8" stroke-width="1.6"/>
<text x="420.0" y="60" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1.2" fill="#4493f8">STAGE 1</text>
<text x="420.0" y="86" text-anchor="middle" font-size="19" font-weight="650" fill="#e6edf3">CAFormer-B36</text>
<text x="420.0" y="109" text-anchor="middle" font-size="15" fill="#9198a1">HybridStem → backbone</text>
<text x="420.0" y="129" text-anchor="middle" font-size="15" fill="#9198a1">→ U-Net decoder</text>
<rect x="620" y="40" width="190" height="110" rx="12" fill="#161b22" stroke="#3d444d" stroke-width="1.6"/>
<text x="715.0" y="60" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1.2" fill="#3d444d">ESTIMATE</text>
<text x="715.0" y="86" text-anchor="middle" font-size="19" font-weight="650" fill="#e6edf3">Initial velocity y₁</text>
<text x="715.0" y="109" text-anchor="middle" font-size="15" fill="#9198a1">300 × 1259</text>
<rect x="875" y="40" width="295" height="110" rx="12" fill="#3d1d00" stroke="#f0883e" stroke-width="1.6"/>
<text x="1022.5" y="60" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1.2" fill="#f0883e">PHYSICS</text>
<text x="1022.5" y="86" text-anchor="middle" font-size="19" font-weight="650" fill="#e6edf3">Devito forward model</text>
<text x="1022.5" y="109" text-anchor="middle" font-size="15" fill="#9198a1">acoustic finite differences</text>
<text x="1022.5" y="129" text-anchor="middle" font-size="15" fill="#9198a1">simulate x₁ = F(y₁) · GPU</text>
<rect x="875" y="215" width="295" height="100" rx="12" fill="#3d1d00" stroke="#f0883e" stroke-width="1.6"/>
<text x="1022.5" y="235" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1.2" fill="#f0883e">MISFIT</text>
<text x="1022.5" y="261" text-anchor="middle" font-size="19" font-weight="650" fill="#e6edf3">Residual shots</text>
<text x="1022.5" y="284" text-anchor="middle" font-size="15" fill="#9198a1">δx = x − x₁</text>
<rect x="430" y="205" width="380" height="120" rx="12" fill="#0f2d1a" stroke="#3fb950" stroke-width="1.6"/>
<text x="620.0" y="225" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1.2" fill="#3fb950">STAGE 2</text>
<text x="620.0" y="251" text-anchor="middle" font-size="19" font-weight="650" fill="#e6edf3">CAFormer-B36 (residual)</text>
<text x="620.0" y="274" text-anchor="middle" font-size="15" fill="#9198a1">seismic stem on [x, δx] (10 ch)</text>
<text x="620.0" y="294" text-anchor="middle" font-size="15" fill="#9198a1">+ velocity stem on y₁ → predicts δy</text>
<rect x="430" y="370" width="380" height="76" rx="12" fill="#2a1745" stroke="#ab7df8" stroke-width="1.6"/>
<text x="620.0" y="402.0" text-anchor="middle" font-size="19" font-weight="650" fill="#e6edf3">ŷ = y₁ + δy</text>
<text x="620.0" y="425.0" text-anchor="middle" font-size="15" fill="#9198a1">final velocity model</text>
<path d="M220,95 L283,95" fill="none" stroke="#9198a1" stroke-width="1.8" marker-end="url(#ah)"/>
<path d="M555,95 L618,95" fill="none" stroke="#9198a1" stroke-width="1.8" marker-end="url(#ah)"/>
<path d="M810,95 L873,95" fill="none" stroke="#9198a1" stroke-width="1.8" marker-end="url(#ah)"/>
<path d="M1022,150 L1022,213" fill="none" stroke="#9198a1" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="1034" y="188" text-anchor="start" font-size="17" font-style="italic" font-weight="600" fill="#e6edf3">x₁</text>
<path d="M875,265 L812,265" fill="none" stroke="#9198a1" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="843" y="255" text-anchor="middle" font-size="17" font-style="italic" font-weight="600" fill="#e6edf3">δx</text>
<path d="M715,150 L715,203" fill="none" stroke="#9198a1" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="727" y="182" text-anchor="start" font-size="17" font-style="italic" font-weight="600" fill="#e6edf3">y₁</text>
<path d="M125,150 L125,265 L428,265" fill="none" stroke="#9198a1" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="300" y="255" text-anchor="middle" font-size="17" font-style="italic" font-weight="600" fill="#e6edf3">x</text>
<path d="M620,325 L620,368" fill="none" stroke="#9198a1" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="632" y="352" text-anchor="start" font-size="17" font-style="italic" font-weight="600" fill="#e6edf3">δy</text>
<text x="875" y="386" font-size="14.5" fill="#9198a1">Stage 2 is trained on δy = y − y₁ (MAPE loss).</text>
<text x="875" y="406" font-size="14.5" fill="#9198a1">δy = 0 reproduces Stage 1, so refinement</text>
<text x="875" y="426" font-size="14.5" fill="#9198a1">starts from the Stage 1 score.</text>
<text x="30" y="386" font-size="14.5" fill="#9198a1">PyTorch and Devito run as separate</text>
<text x="30" y="406" font-size="14.5" fill="#9198a1">processes and exchange .npy files,</text>
<text x="30" y="426" font-size="14.5" fill="#9198a1">avoiding GPU context conflicts.</text>
</g></svg>